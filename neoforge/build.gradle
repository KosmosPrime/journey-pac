plugins {
	id "net.neoforged.gradle.userdev" version "7.0.142"
}

archivesBaseName = "${mod_name}-neoforge-${minecraft_version}"

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

runs {
	client {
		workingDirectory project.file("run")
		systemProperty "forge.logging.markers", "REGISTRIES"
		systemProperty "forge.logging.console.level", "debug"

		modSource project.sourceSets.main
	}
}

dependencies {
	implementation "net.neoforged:neoforge:${neoforge_version}"
	compileOnly project(":common")

	runtimeOnly "maven.modrinth:forge-config-api-port:v21.0.5-1.21-NeoForge"
	implementation "maven.modrinth:open-parties-and-claims:neoforge-1.21-0.23.1"
	compileOnly("info.journeymap:journeymap-api-neoforge:2.0.0-1.21-SNAPSHOT") {changing = true}
	runtimeOnly "maven.modrinth:journeymap:1.21-6.0.0-beta.25+neoforge"
}

processResources {
	from project(":common").sourceSets.main.resources

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "mod_id": project.mod_id, "version": project.version,
			"mod_name": project.mod_name, "mod_author": project.mod_author
	}
}

sourceSets.each {
	it.java.srcDirs(project(":common").sourceSets[it.name].java.srcDirs)
}
