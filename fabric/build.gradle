plugins {
	id 'fabric-loom' version '0.12-SNAPSHOT'
	id 'maven-publish'
	id 'idea'
}

archivesBaseName = "${mod_name}-fabric-${minecraft_version}"

configurations {
	modRuntimeOnly.extendsFrom modRuntimeNest
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	implementation project(":common")

	modRuntimeNest "maven.modrinth:forge-config-api-port:4.2.11"
	modImplementation "maven.modrinth:open-parties-and-claims:fabric-1.19.2-0.15.0"
	modApi("info.journeymap:journeymap-api:1.19.1-1.9-fabric-SNAPSHOT") {changing = true}
	modRuntimeOnly "maven.modrinth:journeymap:1.19.2-5.9.7-fabric"

	// loom strips nested jars, this adds them back in
	modRuntimeOnly configurations.modRuntimeNest.incoming.files.collect {
		zipTree(it).matching {
			include "META-INF/jars/*.jar"
		}
	}
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated(true)
			runDir("run")
		}

		remove server
	}
}
tasks.runServer.enabled = false

processResources {
	from project(":common").sourceSets.main.resources
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "mod_id": project.mod_id, "version": project.version,
			"mod_name": project.mod_name, "mod_author": project.mod_author
	}
}

tasks.withType(JavaCompile) {
	source(project(":common").sourceSets.main.allSource)
}
