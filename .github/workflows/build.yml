name: Gradle JAR
on:
  push:
    tags:
    - '**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Execute Gradle build
        run: ./gradlew build
      - name: Upload Results (Common)
        uses: actions/upload-artifact@v4
        with:
          name: JourneyPAC-Common
          path: common/build/libs
      - name: Upload Results (Forge)
        uses: actions/upload-artifact@v4
        with:
          name: JourneyPAC-Forge
          path: forge/build/libs
      - name: Upload Results (NeoForge)
        uses: actions/upload-artifact@v4
        with:
          name: JourneyPAC-NeoForge
          path: neoforge/build/libs
      - name: Upload Results (Fabric)
        uses: actions/upload-artifact@v4
        with:
          name: JourneyPAC-Fabric
          path: fabric/build/libs
