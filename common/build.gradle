plugins {
	id "org.spongepowered.gradle.vanilla" version "0.2.1-SNAPSHOT"
}

base {
	archivesName = "${mod_name}-common-${minecraft_version}"
}

minecraft {
	version(minecraft_version)
}

dependencies {
	// neoforge dependency (with unobfuscated class names) because OPaC doesn't publish dev jars
	compileOnly "maven.modrinth:open-parties-and-claims:neoforge-1.21.11-0.25.8"
	compileOnly("info.journeymap:journeymap-api-common:2.0.0-1.21.11-SNAPSHOT") {changing = true}
}

processResources {
	def buildProps = project.properties.clone()

	filesMatching(["pack.mcmeta"]) {
		expand buildProps
	}
}
